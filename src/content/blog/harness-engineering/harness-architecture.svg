<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Courier New, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#474747"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="14" fill="#474747" font-weight="bold">Harness System Architecture</text>

  <!-- Outer Harness boundary -->
  <rect x="30" y="50" width="660" height="410" rx="6" fill="none" stroke="#4A8B71" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="45" y="72" font-size="11" fill="#4A8B71" font-weight="bold">Harness（外部驾驭系统）</text>

  <!-- AI Model (CPU) - center -->
  <rect x="270" y="210" width="180" height="60" rx="4" fill="#4A8B71" fill-opacity="0.15" stroke="#4A8B71" stroke-width="1.5"/>
  <text x="360" y="237" text-anchor="middle" font-size="12" fill="#4A8B71" font-weight="bold">AI Model</text>
  <text x="360" y="253" text-anchor="middle" font-size="10" fill="#474747">推理 + 生成</text>

  <!-- Component 1: CLAUDE.md (top) -->
  <rect x="230" y="85" width="260" height="50" rx="4" fill="white" stroke="#474747" stroke-width="1"/>
  <text x="360" y="107" text-anchor="middle" font-size="11" fill="#474747" font-weight="bold">CLAUDE.md</text>
  <text x="360" y="123" text-anchor="middle" font-size="9" fill="#8C928F">系统提示 · 每次会话自动注入</text>
  <line x1="360" y1="135" x2="360" y2="210" stroke="#474747" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Component 2: Skills (left) -->
  <rect x="45" y="175" width="170" height="50" rx="4" fill="white" stroke="#474747" stroke-width="1"/>
  <text x="130" y="197" text-anchor="middle" font-size="11" fill="#474747" font-weight="bold">Skills</text>
  <text x="130" y="213" text-anchor="middle" font-size="9" fill="#8C928F">技能模块 · 按需加载</text>
  <line x1="215" y1="200" x2="270" y2="230" stroke="#474747" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Component 3: MCP Tools (right) -->
  <rect x="505" y="175" width="170" height="50" rx="4" fill="white" stroke="#474747" stroke-width="1"/>
  <text x="590" y="197" text-anchor="middle" font-size="11" fill="#474747" font-weight="bold">MCP Tools</text>
  <text x="590" y="213" text-anchor="middle" font-size="9" fill="#8C928F">工具扩展 · 外部系统连接</text>
  <line x1="505" y1="200" x2="450" y2="230" stroke="#474747" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Component 4: Sub-agents (bottom-left) -->
  <rect x="80" y="320" width="200" height="50" rx="4" fill="white" stroke="#474747" stroke-width="1"/>
  <text x="180" y="342" text-anchor="middle" font-size="11" fill="#474747" font-weight="bold">Sub-agents</text>
  <text x="180" y="358" text-anchor="middle" font-size="9" fill="#8C928F">子代理 · 上下文防火墙</text>
  <line x1="270" y1="260" x2="230" y2="320" stroke="#474747" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="180" y1="320" x2="300" y2="268" stroke="#8C928F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="222" y="298" font-size="8" fill="#8C928F">返回结果</text>

  <!-- Component 5: Hooks (bottom-right) -->
  <rect x="440" y="320" width="200" height="50" rx="4" fill="white" stroke="#474747" stroke-width="1"/>
  <text x="540" y="342" text-anchor="middle" font-size="11" fill="#474747" font-weight="bold">Hooks</text>
  <text x="540" y="358" text-anchor="middle" font-size="9" fill="#8C928F">钩子 · 确定性检查点</text>
  <line x1="450" y1="260" x2="490" y2="320" stroke="#474747" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- OS Analogy annotation -->
  <rect x="45" y="400" width="630" height="40" rx="4" fill="#4A8B71" fill-opacity="0.06" stroke="none"/>
  <text x="360" y="416" text-anchor="middle" font-size="10" fill="#474747">Model = CPU  ·  Context Window = RAM  ·  Harness = OS  ·  Agent = Application</text>
  <text x="360" y="430" text-anchor="middle" font-size="9" fill="#8C928F">同样的硬件，调度好和调度差，效果完全不同</text>

  <!-- External systems (for MCP) -->
  <rect x="540" y="90" width="120" height="35" rx="3" fill="#f3f4f6" stroke="#8C928F" stroke-width="1"/>
  <text x="600" y="112" text-anchor="middle" font-size="9" fill="#8C928F">Linear / Sentry / DB</text>
  <line x1="600" y1="125" x2="600" y2="175" stroke="#8C928F" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
</svg>
