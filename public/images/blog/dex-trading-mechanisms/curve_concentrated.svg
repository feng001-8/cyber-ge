<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8C928F"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; }
    .title { font-size: 20px; font-weight: 600; fill: #474747; }
    .subtitle { font-size: 13px; fill: #8C928F; }
    .label { font-size: 13px; fill: #474747; }
    .axis-label { font-size: 12px; fill: #8C928F; }
    .small { font-size: 11px; fill: #8C928F; }
    .formula { font-size: 14px; font-family: 'SF Mono', Monaco, monospace; }
  </style>
  <rect width="100%" height="100%" fill="white"/>
  <text x="375.0" y="35" text-anchor="middle" class="title">集中流动性 vs 全范围流动性</text>
  <text x="375.0" y="58" text-anchor="middle" class="subtitle">Uniswap V2 → V3 资本效率革命</text>
  <!-- V2 -->
  <text x="190.0" y="100" text-anchor="middle" class="label" fill="#8C928F">Uniswap V2</text>
  <rect x="50" y="120" width="280" height="180" rx="4" fill="none" stroke="#8C928F" stroke-dasharray="4,2"/>
  <rect x="60" y="180" width="260" height="60" rx="4" fill="#8C928F" opacity="0.15"/>
  <line x1="190.0" y1="130" x2="190.0" y2="290" stroke="#4A8B71" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="190.0" y="320" text-anchor="middle" class="small" fill="#4A8B71">当前价格</text>
  <text x="55" y="320" class="small">$0</text>
  <text x="320" y="320" class="small">$∞</text>
  <text x="190.0" y="355" text-anchor="middle" class="label" fill="#D13429">资本效率 ~1x</text>
  <text x="190.0" y="375" text-anchor="middle" class="small">大部分流动性未使用</text>
  <text x="375" y="210" text-anchor="middle" class="title" fill="#4A8B71">→</text>
  <!-- V3 -->
  <text x="560.0" y="100" text-anchor="middle" class="label" fill="#4A8B71">Uniswap V3</text>
  <rect x="420" y="120" width="280" height="180" rx="4" fill="none" stroke="#8C928F" stroke-dasharray="4,2"/>
  <rect x="520" y="140" width="80" height="140" rx="4" fill="#4A8B71" opacity="0.25" stroke="#4A8B71" stroke-width="2"/>
  <line x1="560.0" y1="130" x2="560.0" y2="290" stroke="#4A8B71" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="560.0" y="320" text-anchor="middle" class="small" fill="#4A8B71">当前价格</text>
  <text x="425" y="320" class="small">$0</text>
  <text x="690" y="320" class="small">$∞</text>
  <text x="520" y="320" class="small" fill="#4A8B71">$1800</text>
  <text x="600" y="320" class="small" fill="#4A8B71">$2200</text>
  <text x="560.0" y="355" text-anchor="middle" class="label" fill="#4A8B71">资本效率 最高4000x</text>
  <text x="560.0" y="375" text-anchor="middle" class="small">同等资金，流动性深度提升40倍</text>
  <!-- Comparison -->
  <rect x="220" y="360" width="310" height="45" rx="8" fill="#E5E7EB" opacity="0.5"/>
  <text x="375" y="382" text-anchor="middle" class="label">$1800-$2200 区间提供流动性</text>
  <text x="375" y="400" text-anchor="middle" class="small">V2 需要 $100,000 → V3 只需 $2,500</text>
</svg>
