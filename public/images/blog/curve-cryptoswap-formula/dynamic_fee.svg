<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">

    <style>
        text { font-family: 'Inter', -apple-system, sans-serif; fill: #474747; }
        .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
        .label { font-size: 14px; }
        .title { font-size: 16px; font-weight: 600; }
        .small { font-size: 12px; }
        .subtitle { font-size: 13px; fill: #8C928F; }
    </style>


    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#474747"/>
        </marker>
        <marker id="arrow-jade" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#4A8B71"/>
        </marker>
        <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#8C928F"/>
        </marker>
    </defs>

    
    <!-- Title -->
    <text x="250.0" y="25" class="title" text-anchor="middle">动态手续费机制</text>
    <text x="250.0" y="45" class="subtitle" text-anchor="middle">偏离平衡点越远，手续费越高</text>
    
    <!-- Axes -->
    <line x1="60" y1="290" x2="450" y2="290" stroke="#474747" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="60" y1="290" x2="60" y2="110" stroke="#474747" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- Axis labels -->
    <text x="455" y="295" class="small mono">∏xᵢ/(Σxᵢ/N)ᴺ</text>
    <text x="55" y="105" class="label mono">fee</text>
    
    <!-- Horizontal reference lines -->
    <line x1="60" y1="290.0" x2="440" y2="290.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="60" y1="120.0" x2="440" y2="120.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Fee labels -->
    <text x="50" y="295.0" class="small mono" text-anchor="end" fill="#4A8B71">0.04%</text>
    <text x="50" y="125.0" class="small mono" text-anchor="end" fill="#D13429">0.40%</text>
    
    <!-- X axis labels -->
    <text x="60" y="310" class="small mono" text-anchor="middle">0</text>
    <text x="250.0" y="310" class="small mono" text-anchor="middle">0.5</text>
    <text x="440" y="310" class="small mono" text-anchor="middle">1</text>
    
    <!-- Fee curve -->
    <path d="M 63.8 177.0 L 63.8 177.0 L 67.6 177.4 L 71.4 177.8 L 75.2 178.2 L 79.0 178.6 L 82.8 179.0 L 86.6 179.4 L 90.4 179.9 L 94.2 180.3 L 98.0 180.7 L 101.8 181.2 L 105.6 181.6 L 109.4 182.0 L 113.2 182.5 L 117.0 183.0 L 120.8 183.4 L 124.6 183.9 L 128.4 184.4 L 132.2 184.9 L 136.0 185.4 L 139.8 185.9 L 143.6 186.4 L 147.4 186.9 L 151.2 187.5 L 155.0 188.0 L 158.8 188.5 L 162.6 189.1 L 166.4 189.7 L 170.2 190.2 L 174.0 190.8 L 177.8 191.4 L 181.6 192.0 L 185.4 192.6 L 189.2 193.3 L 193.0 193.9 L 196.8 194.6 L 200.6 195.2 L 204.4 195.9 L 208.2 196.6 L 212.0 197.3 L 215.8 198.0 L 219.6 198.7 L 223.4 199.4 L 227.2 200.2 L 231.0 201.0 L 234.8 201.7 L 238.6 202.5 L 242.4 203.3 L 246.2 204.2 L 250.0 205.0 L 253.8 205.9 L 257.6 206.7 L 261.4 207.6 L 265.2 208.5 L 269.0 209.5 L 272.8 210.4 L 276.6 211.4 L 280.4 212.4 L 284.2 213.4 L 288.0 214.4 L 291.8 215.5 L 295.6 216.6 L 299.4 217.7 L 303.2 218.8 L 307.0 220.0 L 310.8 221.2 L 314.6 222.4 L 318.4 223.7 L 322.2 224.9 L 326.0 226.2 L 329.8 227.6 L 333.6 229.0 L 337.4 230.4 L 341.2 231.8 L 345.0 233.3 L 348.8 234.9 L 352.6 236.4 L 356.4 238.1 L 360.2 239.7 L 364.0 241.4 L 367.8 243.2 L 371.6 245.0 L 375.4 246.9 L 379.2 248.8 L 383.0 250.8 L 386.8 252.8 L 390.6 254.9 L 394.4 257.1 L 398.2 259.3 L 402.0 261.7 L 405.8 264.1 L 409.6 266.6 L 413.4 269.1 L 417.2 271.8 L 421.0 274.5 L 424.8 277.4 L 428.6 280.4 L 432.4 283.5 L 436.2 286.7 L 440.0 290.0" stroke="#4A8B71" stroke-width="2.5" fill="none"/>
    
    <!-- Annotations -->
    <text x="117.0" y="133.61111111111111" class="small" fill="#D13429">远离平衡</text>
    <text x="117.0" y="148.61111111111111" class="small" fill="#D13429">高手续费</text>
    
    <text x="383.0" y="300.55555555555554" class="small" fill="#4A8B71">接近平衡</text>
    <text x="383.0" y="315.55555555555554" class="small" fill="#4A8B71">低手续费</text>
    
    <!-- Equilibrium point -->
    <circle cx="440" cy="290.0" r="5" fill="#4A8B71"/>
    
    <!-- Formula -->
    <text x="250.0" y="330" class="mono small" text-anchor="middle" fill="#8C928F">f = g·f_mid + (1-g)·f_out</text>
    
</svg>