    <!-- Equilibrium point -->
    <circle cx="490" cy="100.0" r="5" fill="#D13429"/>
    <text x="500" y="90.0" class="small" fill="#D13429">平衡点</text>
    
    <!-- Annotation for difference -->
    <line x1="214.79999999999998" y1="253.6" x2="214.79999999999998" y2="339.97955029585796" stroke="#8C928F" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="219.79999999999998" y="296.789775147929" class="small" fill="#8C928F">差距</text>
    
    <!-- Legend -->
    <line x1="380" y1="80" x2="420" y2="80" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="430" y="85" class="small mono">v1: χ = A·K₀</text>
    
    <line x1="380" y1="105" x2="420" y2="105" stroke="#4A8B71" stroke-width="2.5"/>
    <text x="430" y="110" class="small mono">v2: K = A·K₀·γ²/(γ+1-K₀)²</text>
    
</svg>