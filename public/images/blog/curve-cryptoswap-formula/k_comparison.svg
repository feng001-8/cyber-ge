    <!-- Axis labels -->
    <text x="510" y="345" class="label mono">K₀</text>
    <text x="50" y="85" class="label mono">K/A</text>
    
    <!-- Grid lines -->
    <line x1="275.0" y1="100" x2="275.0" y2="340" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="60" y1="220.0" x2="490" y2="220.0" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Tick marks -->
    <text x="60" y="360" class="small mono" text-anchor="middle">0</text>
    <text x="275.0" y="360" class="small mono" text-anchor="middle">0.5</text>
    <text x="490" y="360" class="small mono" text-anchor="middle">1</text>
    <text x="45" y="345.0" class="small mono" text-anchor="end">0</text>
    <text x="45" y="225.0" class="small mono" text-anchor="end">0.5</text>
    <text x="45" y="105.0" class="small mono" text-anchor="end">1</text>
    
